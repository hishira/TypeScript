@if(loading()) {
<div>
    <p-skeleton styleClass="mb-2" />
    <p-skeleton width="10rem" styleClass="mb-2" />
    <p-skeleton width="5rem" styleClass="mb-2" />
</div>
} @else {
<div class="flex align-items-start justify-content-between mb-3">
    <div class="grid flex-grow-1">
        <div class="col-4">
            <app-read-only i18n-title [title]="'Address'">
                {{ address()?.address }}
            </app-read-only>
        </div>
        <div class="col-4">
            <app-read-only i18n-title [title]="'House'">
                {{ address()?.house }}
            </app-read-only>
        </div>
        <div class="col-4">
            <app-read-only i18n-title [title]="'Door'">
                {{ address()?.door }}
            </app-read-only>
        </div>
        <div class="col-4">
            <app-read-only i18n-title [title]="'City'">
                {{ address()?.city }}
            </app-read-only>
        </div>
        <div class="col-4">
            <app-read-only i18n-title [title]="'Country'">
                {{ address()?.country }}
            </app-read-only>
        </div>
        <div class="col-4">
            <app-read-only i18n-title [title]="'Postal Code'">
                {{ address()?.postalCode }}
            </app-read-only>
        </div>
        @if(isLocationAvailable()){
            <div class="col-4">
                <app-read-only i18n-title [title]="'Location'">
                    {{locationComputedString()}}
                </app-read-only>
            </div>
        }
    </div>
    <div>
        <p-button i18n-label label="Edit" icon="pi pi-pencil" (onClick)="addressChange()"
            styleClass="p-button-text"></p-button>
    </div>
</div>
}
