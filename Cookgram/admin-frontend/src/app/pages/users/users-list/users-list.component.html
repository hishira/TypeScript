<p-panel class="w-full">
  <ng-template pTemplate="header">
    <div class="flex justify-content-between align-content-center w-full">
      <span i18n class="text-2xl align-content-center">User list</span>
      <p-button i18n (onClick)="createUser()" [rounded]="true">Create user</p-button>
    </div>
  </ng-template>
  @if(userExists()) {
  <app-empty-list [withRefreshButton]="true" [isEmpty]="!userExists()">
    <p-table [value]="users()" [rows]="users().length" [paginator]="true">
      <ng-template pTemplate="header">
        <tr>
          <th i18n style="width: 25%">
            Email
          </th>
          <th i18n style="width: 25%">
            Username
          </th>
          <th i18n style="width: 25%">
            Full name
          </th>
          <th i18n style="width: 25%">
            Role
          </th>
          <th i18n style="width: 25%">
            Status
          </th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-customer>
        <tr (click)="onRowSelect(customer)" [style.cursor]="'pointer'">
          <td>{{ customer.personalInformation.email }}</td>
          <td> {{ customer.credentials.username }}</td>
          <td><app-read-only>{{ customer.fullName }}</app-read-only></td>
          <td><app-read-only>{{ customer.roles }}</app-read-only></td>
          <td>{{ customer.state.current }}</td>
        </tr>
      </ng-template>
    </p-table>
  </app-empty-list>
  }
  @else {
  <app-table-skeleton [skeletonRows]="skeletonRows" />
  }
</p-panel>
